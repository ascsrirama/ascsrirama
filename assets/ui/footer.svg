<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 48" width="800" height="48">
<title>EOF</title>
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#1A0B2E"/><stop offset=".5" stop-color="#0A0E27"/><stop offset="1" stop-color="#0B1A3A"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.t{font:600 13px 'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace;letter-spacing:4px}
.c{animation:c 1.1s steps(1) infinite}@keyframes c{50%{fill-opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<path d="M0.5 10.5 L10.5 0.5 H789.5 L799.5 10.5 V37.5 L789.5 47.5 H10.5 L0.5 37.5Z" fill="url(#bg)" stroke="#1E2A5A"/>
<g filter="url(#glow)">
<text x="400" y="29" text-anchor="middle" class="t" fill="#00E5FF">// END OF TRANSMISSION <tspan class="c" fill="#FF2E88">█</tspan></text>
</g>
</svg>
